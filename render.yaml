services:
  # RewardsHub Backend API
  - type: web
    name: rewardshub-api
    env: node
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Dispositivos de mostrador: el access token dura un turno y el refresh
      # token 90 dias, de modo que una tablet usada a diario nunca vuelve a ver
      # la pantalla de login. El refresh token es revocable (vive en Mongo).
      - key: ACCESS_EXPIRES
        value: 8h
      - key: REFRESH_EXPIRES
        value: 90d
      # Un refresh token ya rotado se sigue aceptando estos segundos, para que
      # dos pestanas que refrescan a la vez no se cierren la sesion mutuamente.
      - key: REFRESH_GRACE_SECONDS
        value: 30
      - key: ALLOWED_ORIGINS
        sync: false
      - key: USER_COLLECTION
        value: users
      - key: BUSINESSES_COLLECTION
        value: businesses
      - key: SYSTEMS_COLLECTION
        value: systems
      - key: REWARDS_COLLECTION
        value: rewards
      - key: USERS_POINTS_COLLECTION
        value: userPoints
      - key: TRANSACTIONS_COLLECTION
        value: transactions
